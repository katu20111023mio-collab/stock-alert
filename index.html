<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株価アラート</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --sub-text: #666666;
      --border-color: #e5e7eb;
      --input-bg: #ffffff;
      --preview-bg: #eef4ff;
      --preview-border: #cce0ff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --sub-text: #aaa;
      --border-color: #333;
      --input-bg: #2a2a2a;
      --preview-bg: #1a2638;
      --preview-border: #2c4263;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background: var(--bg-color); color: var(--text-color); margin: 0; -webkit-user-select: none; user-select: none; transition: background 0.3s, color 0.3s; }
    .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
    .header-title-box { display: flex; align-items: baseline; gap: 6px; }
    .version-tag { font-size: 0.7rem; color: var(--sub-text); font-weight: normal; }
    
    .card { background: var(--card-bg); padding: 12px 14px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px; transition: background 0.3s; }
    h2 { margin: 0; font-size: 1.05rem; color: var(--text-color); }
    label { font-size: 0.75rem; color: var(--sub-text); display: block; margin-top: 8px; font-weight: bold; }
    
    input, select, textarea { width: 100%; padding: 8px 10px; margin-top: 3px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 16px; background: var(--input-bg); color: var(--text-color); -webkit-user-select: text; user-select: text; }
    textarea { resize: vertical; height: 50px; font-family: inherit; }

    .accordion-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; border-bottom: 2px solid #007aff; padding-bottom: 4px; }
    .accordion-header::after { content: '▲'; font-size: 0.75rem; color: #007aff; transition: transform 0.3s; }
    .accordion-header.collapsed::after { transform: rotate(180deg); }

    /* ステータスバー（2行） */
    .status-bar { font-size: 0.73rem; color: var(--sub-text); background: var(--preview-bg); padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; }
    .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .status-sub-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: var(--sub-text); border-top: 1px dashed var(--border-color); padding-top: 3px; }
    .status-dot { height: 7px; width: 7px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .status-dot.active { background-color: #4caf50; }

    /* 銘柄コード入力 ＆ プレビューの横並びレイアウト */
    .code-preview-row { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
    .code-input-box { width: 90px; flex-shrink: 0; }
    .code-input-box input { text-align: center; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; padding: 6px; }
    
    .stock-info-preview { flex-grow: 1; background: var(--preview-bg); border: 1px solid var(--preview-border); padding: 6px 10px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; min-height: 42px; }
    .preview-name-line { font-size: 0.8rem; font-weight: bold; color: #007aff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-price-line { font-size: 0.85rem; font-weight: bold; margin-top: 2px; display: flex; align-items: center; gap: 6px; }

    .yf-price-box { display: flex; align-items: baseline; gap: 6px; }
    .yf-icon-up { background: #1e88e5; color: white; border-radius: 3px; padding: 1px 4px; font-weight: bold; font-size: 0.75rem; }
    .yf-icon-down { background: #e53935; color: white; border-radius: 3px; padding: 1px 4px; font-weight: bold; font-size: 0.75rem; }
    .yf-change-up { color: #1e88e5; font-weight: bold; font-size: 0.75rem; }
    .yf-change-down { color: #e53935; font-weight: bold; font-size: 0.75rem; }

    /* 条件①②の横並び */
    .conditions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

    /* 登録時のオプション選択行 */
    .register-options { display: flex; gap: 12px; align-items: center; margin-top: 8px; background: var(--bg-color); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.8rem; }
    .option-label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: bold; }

    .submit-btn { width: 100%; padding: 10px; background: #007aff; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    .notify-btn { width: 100%; padding: 8px; background: #34c759; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
    .refresh-btn { padding: 4px 10px; background: #007aff; color: white; border: none; border-radius: 14px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }

    .list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007aff; padding-bottom: 4px; margin-bottom: 10px; }
    .sort-filter-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; font-size: 0.78rem; background: var(--bg-color); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); }
    .filter-row { display: flex; align-items: center; gap: 6px; }
    .filter-row input { padding: 3px 6px; font-size: 14px; margin: 0; }
    .sort-select { max-width: 170px; font-size: 0.78rem; padding: 5px; }

    .item { padding: 10px 12px; border-radius: 8px; position: relative; margin-bottom: 8px; background: var(--card-bg); border: 1px solid var(--border-color); }
    .item.favorite { border-left: 5px solid #ffcc00; }
    .item.disabled { opacity: 0.6; background: var(--bg-color); }
    .item-header { display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-size: 0.95rem; font-weight: bold; color: var(--text-color); display: flex; align-items: center; gap: 4px; }
    .code-badge { font-size: 0.7rem; color: var(--sub-text); font-weight: normal; }

    .star-btn, .gift-btn, .toggle-alert-btn { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0 2px; }
    .star-btn { color: #ccc; }
    .star-btn.active { color: #ffcc00; }
    .gift-btn { opacity: 0.3; filter: grayscale(100%); }
    .gift-btn.active { opacity: 1; filter: grayscale(0%); }

    /* プログレスバー（控えめサイズ） */
    .progress-container { margin-top: 4px; background: var(--border-color); border-radius: 4px; height: 4px; width: 130px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .progress-bar { height: 100%; background: #007aff; width: 0%; transition: width 0.3s; }
    .progress-text { font-size: 0.68rem; color: var(--sub-text); display: inline-block; margin-left: 6px; }

    .memo-tag { font-size: 0.72rem; color: var(--sub-text); background: var(--bg-color); padding: 3px 6px; border-radius: 4px; margin-top: 4px; border: 1px dashed var(--border-color); white-space: pre-wrap; }

    .link-group { display: flex; gap: 4px; align-items: center; }
    /* Y!ファイナンスボタンをスッキリ「y!」表記（矢印なし）に */
    .yf-app-btn { display: inline-flex; align-items: center; justify-content: center; background: #ff0033; color: white; text-decoration: none; font-size: 0.7rem; font-weight: bold; width: 24px; height: 20px; border-radius: 4px; }
    
    .condition-tag { font-size: 0.68rem; color: var(--sub-text); background: var(--preview-bg); padding: 1px 4px; border-radius: 4px; display: inline-block; margin-right: 4px; margin-top: 3px; }
    .dividend-tag { font-size: 0.68rem; color: #2e7d32; background: #e8f5e9; padding: 1px 4px; border-radius: 4px; display: inline-block; margin-right: 4px; margin-top: 3px; font-weight: bold; }
    .gift-tag { font-size: 0.68rem; color: #d81b60; background: #fce4ec; padding: 1px 4px; border-radius: 4px; display: inline-block; margin-right: 4px; margin-top: 3px; font-weight: bold; }
    .chance-badge { font-size: 0.65rem; color: #d97706; background: #fef3c7; padding: 1px 5px; border-radius: 10px; font-weight: bold; margin-left: 4px; }
    body.dark-mode .dividend-tag { color: #81c784; background: #1b3820; }
    body.dark-mode .gift-tag { color: #f48fb1; background: #3a1c28; }
    body.dark-mode .chance-badge { color: #fcd34d; background: #451a03; }

    .btn-group { display: flex; gap: 4px; margin-top: 4px; justify-content: flex-end; align-items: center; }
    .icon-btn { padding: 2px 5px; font-size: 0.75rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; color: var(--text-color); }

    .dark-toggle-btn { background: none; border: 1px solid var(--border-color); padding: 3px 6px; border-radius: 10px; font-size: 0.7rem; cursor: pointer; color: var(--text-color); }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title-box">
      <h2 style="font-size: 1.1rem;">📈 株価アラート</h2>
      <span class="version-tag">ver 2.0.0</span>
    </div>
    <button class="dark-toggle-btn" onclick="toggleDarkMode()">🌙 ダークモード</button>
  </div>

  <div class="status-bar">
    <div class="status-row">
      <div><span id="statusDot" class="status-dot"></span> <span id="statusText">監視待機中</span></div>
      <div id="marketTimeText" style="color:#888; font-weight:500;">市場時間判定中...</div>
    </div>
    <div class="status-sub-row">
      <div id="lastOpenTime" style="color:var(--sub-text);">前回の起動: 初回アクセス</div>
      <div id="nextOpenTimeText" style="color:#007aff; font-weight:bold;">次回営業: 計算中...</div>
    </div>
  </div>

  <button class="notify-btn" onclick="requestNotificationPermission()">🔔 通知の許可を設定する</button>

  <div class="card">
    <div class="accordion-header" id="formAccordionHeader" onclick="toggleFormAccordion()">
      <h2 id="formTitle">銘柄の登録</h2>
    </div>
    
    <div id="formBody">
      <label>銘柄コード（4桁）＆ プレビュー</label>
      <div class="code-preview-row">
        <div class="code-input-box">
          <input type="number" id="stockSearchInput" placeholder="例:7203" oninput="onCodeInput()" maxlength="4">
        </div>
        <div id="stockInfoPreview" class="stock-info-preview">
          <div id="previewName" class="preview-name-line" style="color: var(--sub-text);">4桁のコードを入力</div>
          <div id="previewPrice" class="preview-price-line" style="font-size:0.75rem; color:var(--sub-text);">株価等が表示されます</div>
        </div>
      </div>

      <!-- 銘柄名のカスタム変更（英語対策） -->
      <label for="customNameInput" style="margin-top:6px;">表示名（必要なら変更できます）</label>
      <input type="text" id="customNameInput" placeholder="例: 楽天グループ（自動入力されます）">

      <div class="conditions-grid">
        <div>
          <label for="targetPrice">① 指値 (円以下)</label>
          <input type="number" id="targetPrice" placeholder="例: 1000">
        </div>
        <div>
          <label for="targetDropRate">② 下落率 (-%以上)</label>
          <input type="number" id="targetDropRate" placeholder="例: 3">
        </div>
      </div>

      <div class="register-options">
        <label class="option-label">
          <input type="checkbox" id="regFavCheckbox" style="width:auto; margin:0;"> ⭐ お気に入り
        </label>
        <label class="option-label">
          <input type="checkbox" id="regGiftCheckbox" style="width:auto; margin:0;"> 🎁 優待あり
        </label>
      </div>

      <label for="memoInput">③ メモ（買い増し理由など）</label>
      <textarea id="memoInput" placeholder="例: PER10倍以下。決算発表後に確認"></textarea>

      <button id="submitBtn" class="submit-btn" onclick="addAlert()" disabled>銘柄コードを入力してください</button>
    </div>
  </div>

  <div class="card">
    <div class="list-header">
      <h2>監視中のリスト</h2>
      <button id="refreshBtn" class="refresh-btn" onclick="manualRefresh()">🔄 一括更新</button>
    </div>

    <div class="sort-filter-box">
      <div class="filter-row">
        <span>並び:</span>
        <select id="sortSelect" class="sort-select" onchange="renderList()">
          <option value="created">登録順</option>
          <option value="chance">🔥 購入チャンス順</option>
          <option value="favorite">★ お気に入り優先</option>
          <option value="not-favorite">☆ お気に入り以外</option>
          <option value="target-close">🎯 到達度が近い順</option>
          <option value="gift">🎁 優待あり優先</option>
          <option value="priceDesc">株価が高い順</option>
          <option value="priceAsc">株価が安い順</option>
          <option value="drop">下落率が大きい順</option>
          <option value="rise">上昇率が大きい順</option>
          <option value="code">銘柄コード順</option>
        </select>
      </div>
      <div class="filter-row">
        <span>株価絞り込み:</span>
        <input type="number" id="minPriceInput" placeholder="最小" style="width: 60px;" oninput="renderList()"> 円 〜
        <input type="number" id="maxPriceInput" placeholder="最大" style="width: 60px;" oninput="renderList()"> 円
      </div>
    </div>

    <div id="alertList"></div>
  </div>

  <script>
    const MY_SERVER_URL = "https://autumn-shape-d4ac.sub-katu20111023mio.workers.dev";

    const NAME_FIX_MAP = {
      "7203": "トヨタ自動車",
      "9432": "NTT",
      "9434": "ソフトバンク",
      "4755": "楽天グループ",
      "7775": "大建メディカル",
      "7261": "マツダ",
      "9984": "ソフトバンクグループ",
      "8306": "三菱UFJ",
      "8316": "三井住友FG",
      "8411": "みずほFG",
      "6758": "ソニーグループ",
      "7974": "任天堂"
    };

    let alerts = JSON.parse(localStorage.getItem('stock_alerts') || '[]');
    let editingIndex = null;
    let priceCache = {};
    let currentFetchedStock = null;
    let searchTimer = null;
    let isFormOpen = true;

    window.onload = () => {
      if (localStorage.getItem('dark_mode') === 'true') {
        document.body.classList.add('dark-mode');
      }
      updateLastOpenTime();
      checkMarketTimeAndMonitor();
      renderList();
      setInterval(checkMarketTimeAndMonitor, 30000);
    };

    function toggleFormAccordion() {
      isFormOpen = !isFormOpen;
      const body = document.getElementById('formBody');
      const header = document.getElementById('formAccordionHeader');
      if (isFormOpen) {
        body.style.display = 'block';
        header.classList.remove('collapsed');
      } else {
        body.style.display = 'none';
        header.classList.add('collapsed');
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('dark_mode', document.body.classList.contains('dark-mode'));
    }

    function updateLastOpenTime() {
      const lastTime = localStorage.getItem('last_open_time');
      const element = document.getElementById('lastOpenTime');
      if (lastTime) element.innerText = `前回の起動: ${lastTime}`;

      const now = new Date();
      const formatted = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      localStorage.setItem('last_open_time', formatted);
    }

    function saveToStorage() {
      localStorage.setItem('stock_alerts', JSON.stringify(alerts));
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.permission === 'granted' ? alert('通知許可済みです') :
        Notification.requestPermission().then(p => p === 'granted' ? alert('許可されました！') : alert('拒否されました'));
      }
    }

    function sendNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: 'https://finance.yahoo.co.jp/favicon.ico' });
      }
    }

    function isMarketOpen() {
      const now = new Date();
      const day = now.getDay();
      if (day === 0 || day === 6) return false;
      const time = now.getHours() * 100 + now.getMinutes();
      return (time >= 900 && time <= 1130) || (time >= 1230 && time <= 1530);
    }

    function getNextMarketOpenText() {
      const now = new Date();
      const day = now.getDay();
      const time = now.getHours() * 100 + now.getMinutes();

      if (day >= 1 && day <= 5 && time < 900) {
        return "次回営業: 本日 09:00〜";
      }
      if (day >= 1 && day <= 5 && time >= 1130 && time < 1230) {
        return "次回営業: 本日 12:30〜（後場）";
      }

      let nextDate = new Date(now);
      nextDate.setDate(nextDate.getDate() + 1);

      while (nextDate.getDay() === 0 || nextDate.getDay() === 6) {
        nextDate.setDate(nextDate.getDate() + 1);
      }

      const isTomorrow = (nextDate.getDate() === now.getDate() + 1);
      const daysStr = ["日", "月", "火", "水", "木", "金", "土"];
      const dateLabel = isTomorrow ? "明日" : `${nextDate.getMonth() + 1}/${nextDate.getDate()}(${daysStr[nextDate.getDay()]})`;

      return `次回営業: ${dateLabel} 09:00〜`;
    }

    function checkMarketTimeAndMonitor() {
      const isOpen = isMarketOpen();
      document.getElementById('statusDot').className = isOpen ? "status-dot active" : "status-dot";
      document.getElementById('statusText').innerText = isOpen ? "リアルタイム監視中" : "監視停止中（時間外）";
      document.getElementById('marketTimeText').innerText = isOpen ? "市場：営業時間内" : "市場：営業時間外";
      
      const nextText = isOpen ? "次回営業: 取引進行中" : getNextMarketOpenText();
      document.getElementById('nextOpenTimeText').innerText = nextText;

      refreshAllPrices();
    }

    async function fetchStockQuote(code) {
      if (!code || !/^\d{4}$/.test(code)) return null;
      try {
        const res = await fetch(`${MY_SERVER_URL}?code=${code}`);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.chart || !data.chart.result || !data.chart.result[0]) return null;

        const meta = data.chart.result[0].meta;
        const price = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose || meta.previousClose;
        const changeNum = parseFloat((price - prevClose).toFixed(2));
        const changePercent = parseFloat(((changeNum / prevClose) * 100).toFixed(2));
        
        let rawName = meta.shortName || meta.symbol.replace('.T', '');
        let name = NAME_FIX_MAP[code] || rawName;
        
        const dividendRate = meta.trailingAnnualDividendRate || null;
        let dividendYield = null;
        if (dividendRate && price > 0) {
          dividendYield = parseFloat(((dividendRate / price) * 100).toFixed(2));
        }

        return { code, name, rawName, price, changeNum, changePercent, dividendRate, dividendYield };
      } catch (e) {
        return null;
      }
    }

    function onCodeInput() {
      clearTimeout(searchTimer);
      const code = document.getElementById('stockSearchInput').value.trim();
      const nameLine = document.getElementById('previewName');
      const priceLine = document.getElementById('previewPrice');

      if (code.length !== 4) {
        nameLine.innerText = '4桁のコードを入力';
        nameLine.style.color = 'var(--sub-text)';
        priceLine.innerHTML = '株価等が表示されます';
        resetSubmitBtn();
        return;
      }

      nameLine.innerText = '情報を取得中...';
      nameLine.style.color = '#007aff';
      priceLine.innerHTML = '';

      searchTimer = setTimeout(async () => {
        const stockData = await fetchStockQuote(code);
        if (stockData) {
          currentFetchedStock = stockData;
          nameLine.innerText = `${stockData.name} (${stockData.code})`;
          priceLine.innerHTML = createYfHTML(stockData);
          
          // カスタム名入力欄に自動反映（未入力またはプレビュー中なら）
          const customInput = document.getElementById('customNameInput');
          if (!customInput.value || editingIndex !== null) {
            customInput.value = stockData.name;
          }

          const submitBtn = document.getElementById('submitBtn');
          submitBtn.disabled = false;
          submitBtn.innerText = editingIndex !== null ? '変更を保存する' : 'アラートを追加する';
        } else {
          currentFetchedStock = null;
          nameLine.innerText = '取得エラー';
          nameLine.style.color = '#e53935';
          priceLine.innerHTML = '正しい4桁コードを確認してください';
          resetSubmitBtn();
        }
      }, 150);
    }

    function resetSubmitBtn() {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '銘柄コードを入力してください';
      currentFetchedStock = null;
    }

    function createYfHTML(quote) {
      const isUp = quote.changeNum >= 0;
      const iconClass = isUp ? 'yf-icon-up' : 'yf-icon-down';
      const changeClass = isUp ? 'yf-change-up' : 'yf-change-down';
      const arrow = isUp ? '↑' : '↓';

      return `
        <div class="yf-price-box">
          <div class="${iconClass}">${arrow}</div>
          <span style="font-size:0.9rem;">${quote.price.toLocaleString()}円</span>
          <span class="${changeClass}">${isUp ? '+' : ''}${quote.changeNum} (${isUp ? '+' : ''}${quote.changePercent}%)</span>
        </div>
      `;
    }

    async function manualRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.innerText = '🔄 更新中...';
      await refreshAllPrices();
      btn.disabled = false;
      btn.innerText = '🔄 一括更新';
    }

    async function refreshSinglePrice(index, code) {
      priceCache[code] = null;
      renderList();
      const quote = await fetchStockQuote(code);
      if (quote) {
        priceCache[code] = quote;
        saveToStorage();
        checkAndNotify(alerts[index], quote);
      } else {
        priceCache[code] = { error: true };
      }
      renderList();
    }

    async function refreshAllPrices() {
      for (let i = 0; i < alerts.length; i++) {
        const item = alerts[i];
        const quote = await fetchStockQuote(item.code);
        if (quote) {
          priceCache[item.code] = quote;
          saveToStorage();
          checkAndNotify(item, quote);
        } else {
          priceCache[item.code] = { error: true };
        }
      }
      renderList();
    }

    function checkAndNotify(item, quote) {
      if (item.disabled) return;
      let triggered = [];
      if (item.price && quote.price <= parseFloat(item.price)) {
        triggered.push(`指定指値(${item.price}円)以下 (${quote.price}円)`);
      }
      if (item.rate && quote.changePercent <= -Math.abs(parseFloat(item.rate))) {
        triggered.push(`値下がり率(-${item.rate}%)以上 (${quote.changePercent}%)`);
      }
      if (triggered.length > 0) {
        sendNotification(`🚨 株価アラート: ${item.name}`, triggered.join(' / '));
      }
    }

    function addAlert() {
      if (!currentFetchedStock) return;

      const isExist = alerts.some((item, idx) => item.code === currentFetchedStock.code && idx !== editingIndex);
      if (isExist) {
        if (!confirm(`【${currentFetchedStock.code}】は既にリストに存在します。本当に登録しますか？`)) return;
      }

      const customName = document.getElementById('customNameInput').value.trim();
      const finalName = customName || currentFetchedStock.name;
      const price = document.getElementById('targetPrice').value;
      const rate = document.getElementById('targetDropRate').value;
      const memo = document.getElementById('memoInput').value;
      const isFav = document.getElementById('regFavCheckbox').checked;
      const isGift = document.getElementById('regGiftCheckbox').checked;

      let giftDateVal = null;
      if (isGift) {
        if (editingIndex !== null && alerts[editingIndex].giftDate) {
          giftDateVal = alerts[editingIndex].giftDate;
        } else {
          const now = new Date();
          giftDateVal = `${String(now.getFullYear()).slice(-2)}/${String(now.getMonth() + 1).padStart(2, '0')}`;
        }
      }

      const alertData = { 
        name: finalName, 
        code: currentFetchedStock.code, 
        price: price || null, 
        rate: rate || null,
        memo: memo || '',
        favorite: isFav,
        gift: isGift,
        giftDate: giftDateVal,
        disabled: editingIndex !== null ? (alerts[editingIndex].disabled || false) : false
      };

      if (editingIndex !== null) {
        alerts[editingIndex] = alertData;
        editingIndex = null;
        document.getElementById('formTitle').innerText = '銘柄の登録';
      } else {
        alerts.push(alertData);
      }

      saveToStorage();
      clearForm();
      if (isFormOpen) toggleFormAccordion();
      refreshAllPrices();
    }

    function clearForm() {
      document.getElementById('stockSearchInput').value = '';
      document.getElementById('customNameInput').value = '';
      document.getElementById('targetPrice').value = '';
      document.getElementById('targetDropRate').value = '';
      document.getElementById('memoInput').value = '';
      document.getElementById('regFavCheckbox').checked = false;
      document.getElementById('regGiftCheckbox').checked = false;
      document.getElementById('previewName').innerText = '4桁のコードを入力';
      document.getElementById('previewName').style.color = 'var(--sub-text)';
      document.getElementById('previewPrice').innerHTML = '株価等が表示されます';
      resetSubmitBtn();
    }

    function toggleFavorite(index) {
      alerts[index].favorite = !alerts[index].favorite;
      saveToStorage();
      renderList();
    }

    function toggleGift(index) {
      alerts[index].gift = !alerts[index].gift;
      if (alerts[index].gift && !alerts[index].giftDate) {
        const now = new Date();
        alerts[index].giftDate = `${String(now.getFullYear()).slice(-2)}/${String(now.getMonth() + 1).padStart(2, '0')}`;
      }
      saveToStorage();
      renderList();
    }

    function toggleAlertActive(index) {
      alerts[index].disabled = !alerts[index].disabled;
      saveToStorage();
      renderList();
    }

    function calculateChanceScore(item, quote) {
      if (!quote || quote.error) return 0;
      let score = 50;
      if (item.price) {
        const target = parseFloat(item.price);
        const current = quote.price;
        if (current <= target) score += 40;
        else {
          const diffRatio = (current - target) / target;
          if (diffRatio < 0.05) score += 30;
          else if (diffRatio < 0.10) score += 20;
          else if (diffRatio < 0.20) score += 10;
        }
      }
      if (quote.changePercent < 0) {
        score += Math.min(Math.abs(quote.changePercent) * 5, 20);
      }
      if (item.favorite) score += 10;
      return Math.min(Math.round(score), 100);
    }

    function renderList() {
      const listDiv = document.getElementById('alertList');
      if (alerts.length === 0) {
        listDiv.innerHTML = '<div style="color:#999; font-size:0.8rem; padding:10px 0;">登録されているアラートはありません。</div>';
        return;
      }

      const sortType = document.getElementById('sortSelect').value;
      const minPrice = parseFloat(document.getElementById('minPriceInput').value) || 0;
      const maxPrice = parseFloat(document.getElementById('maxPriceInput').value) || Infinity;

      let filteredAlerts = alerts.map((item, index) => {
        const quote = priceCache[item.code];
        const chanceScore = calculateChanceScore(item, quote);
        let percent = 0;
        if (quote && !quote.error && item.price) {
          const target = parseFloat(item.price);
          const current = quote.price;
          percent = Math.min(Math.max((target / current) * 100, 0), 100);
        }
        return { item, originalIndex: index, quote, chanceScore, percent };
      }).filter(({ quote }) => {
        if (!quote || quote.error) return true; 
        return quote.price >= minPrice && quote.price <= maxPrice;
      });

      filteredAlerts.sort((a, b) => {
        if (sortType === 'chance') return b.chanceScore - a.chanceScore;
        if (sortType === 'favorite') return (b.item.favorite ? 1 : 0) - (a.item.favorite ? 1 : 0);
        if (sortType === 'not-favorite') return (b.item.favorite ? 0 : 1) - (a.item.favorite ? 0 : 1);
        if (sortType === 'target-close') return b.percent - a.percent;
        if (sortType === 'gift') return (b.item.gift ? 1 : 0) - (a.item.gift ? 1 : 0);
        if (sortType === 'code') return a.item.code.localeCompare(b.item.code);
        
        const qA = a.quote;
        const qB = b.quote;
        if (sortType === 'priceDesc' || sortType === 'priceAsc') {
          const pA = (qA && !qA.error) ? qA.price : 0;
          const pB = (qB && !qB.error) ? qB.price : 0;
          return sortType === 'priceDesc' ? pB - pA : pA - pB;
        }
        if (sortType === 'drop' || sortType === 'rise') {
          const valA = (qA && !qA.error) ? qA.changePercent : 0;
          const valB = (qB && !qB.error) ? qB.changePercent : 0;
          return sortType === 'drop' ? valA - valB : valB - valA;
        }
        return a.originalIndex - b.originalIndex;
      });

      if (filteredAlerts.length === 0) {
        listDiv.innerHTML = '<div style="color:#999; font-size:0.8rem; padding:10px 0;">条件に該当する銘柄はありません。</div>';
        return;
      }

      listDiv.innerHTML = filteredAlerts.map(({ item, originalIndex, quote, chanceScore, percent }) => {
        const yfWebUrl = `https://finance.yahoo.co.jp/quote/${item.code}.T`;
        
        let priceDisplay = '<div style="font-size:0.75rem; color:#888; margin-top:3px;">株価を取得中...</div>';
        let progressArea = '';
        let dividendDisplay = '';
        let chanceBadgeHtml = `<span class="chance-badge">🔥 ${chanceScore}pt</span>`;

        if (quote && !quote.error) {
          priceDisplay = createYfHTML(quote);
          if (quote.dividendRate) {
            const yieldStr = quote.dividendYield ? ` (${quote.dividendYield}%)` : '';
            dividendDisplay = `<span class="dividend-tag">💰 配当: ${quote.dividendRate}円${yieldStr}</span>`;
          }
          if (item.price) {
            progressArea = `
              <div style="margin-top: 4px;">
                <div class="progress-container">
                  <div class="progress-bar" style="width: ${percent}%;"></div>
                </div>
                <span class="progress-text">到達度: ${percent.toFixed(1)}%</span>
              </div>
            `;
          }
        } else if (quote && quote.error) {
          priceDisplay = '<div style="font-size:0.75rem; color:#e53935; margin-top:3px;">※取得失敗</div>';
        }

        const isOFF = item.disabled;

        return `
          <div class="item ${item.favorite ? 'favorite' : ''} ${isOFF ? 'disabled' : ''}">
            <div class="item-header">
              <span class="item-title">
                <button class="star-btn ${item.favorite ? 'active' : ''}" onclick="toggleFavorite(${originalIndex})">★</button>
                <button class="gift-btn ${item.gift ? 'active' : ''}" onclick="toggleGift(${originalIndex})" title="優待切り替え">🎁</button>
                ${item.name} <span class="code-badge">(${item.code})</span>
                ${chanceBadgeHtml}
              </span>
              <div class="link-group">
                <button class="toggle-alert-btn" onclick="toggleAlertActive(${originalIndex})" title="${isOFF ? 'アラートOFF' : 'アラートON'}">
                  ${isOFF ? '🔕' : '🔔'}
                </button>
                <a href="${yfWebUrl}" target="_blank" class="yf-app-btn" title="Yahoo!ファイナンス">y!</a>
              </div>
            </div>
            ${priceDisplay}
            ${progressArea}
            <div>
              ${item.price ? `<span class="condition-tag">指値: ${item.price}円</span>` : ''}
              ${item.rate ? `<span class="condition-tag">下落: -${item.rate}%以上</span>` : ''}
              ${dividendDisplay}
              ${item.gift ? `<span class="gift-tag">🎁 優待 <small>(${item.giftDate || ''})</small></span>` : ''}
            </div>
            ${item.memo ? `<div class="memo-tag">📝 ${item.memo}</div>` : ''}
            <div class="btn-group">
              <button class="icon-btn" onclick="refreshSinglePrice(${originalIndex}, '${item.code}')" title="再取得">🔄</button>
              <button class="icon-btn" onclick="editAlert(${originalIndex})" title="編集">✏️</button>
              <button class="icon-btn" onclick="deleteAlert(${originalIndex})" title="削除">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function editAlert(index) {
      const item = alerts[index];
      if (!isFormOpen) toggleFormAccordion();
      document.getElementById('stockSearchInput').value = item.code;
      document.getElementById('customNameInput').value = item.name;
      document.getElementById('targetPrice').value = item.price || '';
      document.getElementById('targetDropRate').value = item.rate || '';
      document.getElementById('memoInput').value = item.memo || '';
      document.getElementById('regFavCheckbox').checked = item.favorite || false;
      document.getElementById('regGiftCheckbox').checked = item.gift || false;
      editingIndex = index;
      document.getElementById('formTitle').innerText = 'アラートの編集';
      onCodeInput();
    }

    function deleteAlert(index) {
      if (confirm('このアラートを削除しますか？')) {
        alerts.splice(index, 1);
        saveToStorage();
        renderList();
      }
    }
  </script>
</body>
</html>
