<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株価アラート PWA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: #f0f2f5; margin: 0; -webkit-user-select: none; user-select: none; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
    h2 { margin: 0; font-size: 1.1rem; color: #1a1a1a; }
    label { font-size: 0.8rem; color: #666; display: block; margin-top: 10px; font-weight: bold; }
    
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; -webkit-user-select: text; user-select: text; }
    
    .status-bar { font-size: 0.75rem; color: #555; background: #eef4ff; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    .status-dot { height: 8px; width: 8px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .status-dot.active { background-color: #4caf50; }

    .yf-price-box { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
    .yf-icon-up { background: #1e88e5; color: white; border-radius: 4px; padding: 2px 6px; font-weight: bold; font-size: 0.85rem; }
    .yf-icon-down { background: #e53935; color: white; border-radius: 4px; padding: 2px 6px; font-weight: bold; font-size: 0.85rem; }
    .yf-price-val { font-size: 1.5rem; font-weight: bold; color: #111; letter-spacing: -0.5px; }
    .yf-change-up { color: #1e88e5; font-weight: bold; font-size: 0.9rem; line-height: 1.2; }
    .yf-change-down { color: #e53935; font-weight: bold; font-size: 0.9rem; line-height: 1.2; }

    .condition-box { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .submit-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; margin-top: 14px; cursor: pointer; }
    .notify-btn { width: 100%; padding: 10px; background: #34c759; color: white; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    .refresh-btn { padding: 6px 12px; background: #007aff; color: white; border: none; border-radius: 16px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }

    .list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007aff; padding-bottom: 6px; margin-bottom: 12px; }
    .item { padding: 12px; border-radius: 8px; position: relative; margin-bottom: 8px; background: #fff; border: 1px solid #e5e7eb; }
    .item-header { display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-size: 1.05rem; font-weight: bold; color: #111; }
    .condition-tag { font-size: 0.75rem; color: #555; background: #eef4ff; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-right: 4px; margin-top: 6px; }
    
    .yf-link-btn { display: inline-flex; align-items: center; gap: 4px; background: #ff0033; color: white; text-decoration: none; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 12px; }
    .btn-group { display: flex; gap: 6px; margin-top: 10px; }
    .mini-btn { padding: 6px 12px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .icon-btn { padding: 6px 10px; font-size: 0.9rem; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; }
    .edit-btn { background: #e0e0e0; color: #333; }
    .delete-btn { background: #ff3b30; color: white; }

    .footer { text-align: center; padding: 16px 0 24px; color: #888; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-row">
      <div><span id="statusDot" class="status-dot"></span> <span id="statusText">監視待機中</span></div>
      <div id="marketTimeText" style="color:#888;">市場時間判定中...</div>
    </div>
    <div style="margin-top: 4px; color: #777; font-size: 0.7rem;" id="lastOpenTime">
      前回の起動: 初回アクセス
    </div>
  </div>

  <button class="notify-btn" onclick="requestNotificationPermission()">🔔 通知の許可を設定する</button>

  <div class="card">
    <div style="border-bottom: 2px solid #007aff; padding-bottom: 6px;">
      <h2 id="formTitle">銘柄の登録</h2>
    </div>
    
    <label for="stockNameInput">銘柄名またはメモ</label>
    <input type="text" id="stockNameInput" placeholder="例: マツダ, トヨタ">

    <label for="stockCodeInput">4桁の銘柄コード</label>
    <input type="number" id="stockCodeInput" placeholder="例: 7261" oninput="updatePricePreview()">

    <div id="pricePreview" style="display: none; margin-top: 10px; background: #f8fafc; padding: 10px; border-radius: 8px;">
      <div style="font-size: 0.75rem; color: #888;">現在株価 (参考)</div>
      <div id="previewContent">データ取得中...</div>
    </div>

    <div class="condition-box">
      <div style="font-weight: bold; font-size: 0.85rem; color: #333;">アラート通知条件</div>
      <label for="targetPrice">① 指定安値（円）以下で通知</label>
      <input type="number" id="targetPrice" placeholder="例: 1000">

      <label for="targetDropRate">② 値下がり率（前日比 -%）以上で通知</label>
      <input type="number" id="targetDropRate" placeholder="例: 3">
    </div>

    <button id="submitBtn" class="submit-btn" onclick="addAlert()">アラートを追加する</button>
  </div>

  <div class="card">
    <div class="list-header">
      <h2>監視中のリスト</h2>
      <button id="refreshBtn" class="refresh-btn" onclick="manualRefresh()">🔄 一括更新</button>
    </div>
    <div id="alertList"></div>
  </div>

  <footer class="footer">
    株価アラート PWA ver 1.2.0
  </footer>

  <script>
    let alerts = JSON.parse(localStorage.getItem('stock_alerts') || '[]');
    let editingIndex = null;
    let priceCache = {};
    let previewTimer = null;

    window.onload = () => {
      updateLastOpenTime();
      checkMarketTimeAndMonitor();
      renderList();
      setInterval(checkMarketTimeAndMonitor, 30000);
    };

    function updateLastOpenTime() {
      const lastTime = localStorage.getItem('last_open_time');
      const element = document.getElementById('lastOpenTime');
      if (lastTime) element.innerText = `前回の起動: ${lastTime}`;

      const now = new Date();
      const formatted = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      localStorage.setItem('last_open_time', formatted);
    }

    function saveToStorage() {
      localStorage.setItem('stock_alerts', JSON.stringify(alerts));
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('通知が許可されました！');
            new Notification("株価アラート", { body: "通知テスト：設定完了" });
          } else {
            alert('通知が拒否されました。設定から許可してください。');
          }
        });
      } else {
        alert('このブラウザでは通知機能が有効化できません。「ホーム画面に追加」を行ってください。');
      }
    }

    function isMarketOpen() {
      const now = new Date();
      const day = now.getDay();
      if (day === 0 || day === 6) return false;
      const time = now.getHours() * 100 + now.getMinutes();
      return (time >= 900 && time <= 1130) || (time >= 1230 && time <= 1530);
    }

    function checkMarketTimeAndMonitor() {
      const isOpen = isMarketOpen();
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const timeText = document.getElementById('marketTimeText');

      if (isOpen) {
        dot.className = "status-dot active";
        statusText.innerText = "リアルタイム監視中";
        timeText.innerText = "市場：営業時間内";
      } else {
        dot.className = "status-dot";
        statusText.innerText = "監視停止中（時間外）";
        timeText.innerText = "市場：営業時間外";
      }
      refreshAllPrices();
    }

    async function fetchStockQuote(code) {
      if (!code || !/^\d{4}$/.test(code)) return null;

      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${code}.T?interval=1d`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        if (!res.ok) return null;
        
        const data = await res.json();
        if (!data.chart || !data.chart.result || !data.chart.result[0]) return null;

        const result = data.chart.result[0];
        const meta = result.meta;
        const price = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose || meta.previousClose;
        const changeNum = parseFloat((price - prevClose).toFixed(2));
        const changePercent = parseFloat(((changeNum / prevClose) * 100).toFixed(2));

        return { price, changeNum, changePercent };
      } catch (e) {
        return null;
      }
    }

    function updatePricePreview() {
      clearTimeout(previewTimer);
      const code = document.getElementById('stockCodeInput').value.trim();
      const previewDiv = document.getElementById('pricePreview');
      const contentDiv = document.getElementById('previewContent');

      if (code.length !== 4) {
        previewDiv.style.display = 'none';
        return;
      }

      previewDiv.style.display = 'block';
      contentDiv.innerHTML = '<div style="color:#888; font-size:0.85rem;">現在値を取得中...</div>';

      previewTimer = setTimeout(async () => {
        const quote = await fetchStockQuote(code);
        if (quote) {
          contentDiv.innerHTML = createYfHTML(quote);
        } else {
          contentDiv.innerHTML = '<div style="color:#e53935; font-size:0.85rem;">※現在値の取得に失敗しました（コードをご確認ください）</div>';
        }
      }, 400);
    }

    function createYfHTML(quote) {
      const isUp = quote.changeNum >= 0;
      const iconClass = isUp ? 'yf-icon-up' : 'yf-icon-down';
      const changeClass = isUp ? 'yf-change-up' : 'yf-change-down';
      const arrow = isUp ? '↑' : '↓';

      return `
        <div class="yf-price-box">
          <div class="${iconClass}">${arrow}</div>
          <div class="yf-price-val">${quote.price.toLocaleString()}円</div>
          <div style="margin-left: 6px;">
            <div class="${changeClass}">${isUp ? '+' : ''}${quote.changeNum} (${isUp ? '+' : ''}${quote.changePercent}%)</div>
          </div>
        </div>
      `;
    }

    async function manualRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.innerText = '🔄 更新中...';
      await refreshAllPrices();
      btn.disabled = false;
      btn.innerText = '🔄 一括更新';
    }

    async function refreshSinglePrice(index, code) {
      priceCache[code] = null;
      renderList();
      
      const quote = await fetchStockQuote(code);
      priceCache[code] = quote || { error: true };
      renderList();
    }

    async function refreshAllPrices() {
      for (let item of alerts) {
        const quote = await fetchStockQuote(item.code);
        priceCache[item.code] = quote || { error: true };
      }
      renderList();
    }

    function addAlert() {
      const name = document.getElementById('stockNameInput').value.trim();
      const code = document.getElementById('stockCodeInput').value.trim();
      const price = document.getElementById('targetPrice').value;
      const rate = document.getElementById('targetDropRate').value;

      if (!name || !code) {
        alert('「銘柄名」と「4桁の銘柄コード」の両方を入力してください。');
        return;
      }

      if (code.length !== 4) {
        alert('銘柄コードは4桁の数字で入力してください。');
        return;
      }

      if (!price && !rate) {
        alert('少なくとも1つのアラート条件（指定安値 または 値下がり率）を入力してください。');
        return;
      }

      const alertData = { name: name, code: code, price: price || null, rate: rate || null };

      if (editingIndex !== null) {
        alerts[editingIndex] = alertData;
        editingIndex = null;
        document.getElementById('formTitle').innerText = '銘柄の登録';
        document.getElementById('submitBtn').innerText = 'アラートを追加する';
      } else {
        alerts.push(alertData);
      }

      saveToStorage();
      clearForm();
      refreshAllPrices();
    }

    function clearForm() {
      document.getElementById('stockNameInput').value = '';
      document.getElementById('stockCodeInput').value = '';
      document.getElementById('targetPrice').value = '';
      document.getElementById('targetDropRate').value = '';
      document.getElementById('pricePreview').style.display = 'none';
    }

    function renderList() {
      const listDiv = document.getElementById('alertList');
      if (alerts.length === 0) {
        listDiv.innerHTML = '<div style="color:#999; font-size:0.85rem; padding:12px 0;">登録されているアラートはありません。</div>';
        return;
      }

      listDiv.innerHTML = alerts.map((item, index) => {
        const yfUrl = `https://finance.yahoo.co.jp/quote/${item.code}.T`;
        const quote = priceCache[item.code];
        
        let priceDisplay = '<div style="font-size:0.8rem; color:#888; margin-top:4px;">株価を取得中...</div>';
        if (quote && !quote.error) {
          priceDisplay = createYfHTML(quote);
        } else if (quote && quote.error) {
          priceDisplay = '<div style="font-size:0.8rem; color:#e53935; margin-top:4px;">※現在値の取得失敗</div>';
        }

        return `
          <div class="item">
            <div class="item-header">
              <span class="item-title">${item.name} (${item.code})</span>
              <a href="${yfUrl}" target="_blank" class="yf-link-btn">Yahoo! ↗</a>
            </div>
            ${priceDisplay}
            <div>
              ${item.price ? `<span class="condition-tag">安値: ${item.price}円以下</span>` : ''}
              ${item.rate ? `<span class="condition-tag">下落: -${item.rate}%以上</span>` : ''}
            </div>
            <div class="btn-group">
              <button class="icon-btn" onclick="refreshSinglePrice(${index}, '${item.code}')" title="株価を再取得">🔄</button>
              <button class="mini-btn edit-btn" onclick="editAlert(${index})">編集</button>
              <button class="mini-btn delete-btn" onclick="deleteAlert(${index})">削除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function editAlert(index) {
      const item = alerts[index];
      document.getElementById('stockNameInput').value = item.name;
      document.getElementById('stockCodeInput').value = item.code;
      document.getElementById('targetPrice').value = item.price || '';
      document.getElementById('targetDropRate').value = item.rate || '';
      
      editingIndex = index;
      document.getElementById('formTitle').innerText = 'アラートの編集';
      document.getElementById('submitBtn').innerText = '変更を保存する';
      updatePricePreview();
    }

    function deleteAlert(index) {
      if (confirm('このアラートを削除しますか？')) {
        alerts.splice(index, 1);
        saveToStorage();
        renderList();
      }
    }
  </script>
</body>
</html>
