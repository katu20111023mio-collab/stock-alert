<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株価アラート ver 4.1.1</title>
  <!-- 銘柄辞書ファイルの読み込み -->
  <script src="meigara.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --sub-text: #666666;
      --border-color: #e0e0e0;
      --primary-color: #007aff;
      --danger-color: #ff3b30;
      --success-color: #34c759;
      --warning-color: #ff9500;
      --badge-bg: #fff3cd;
      --badge-text: #856404;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --sub-text: #aaa;
      --border-color: #333;
      --badge-bg: #3a3000;
      --badge-text: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; max-width: 600px; margin: 0 auto; transition: background-color 0.3s, color 0.3s; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .app-title { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .version-tag { font-size: 0.75rem; color: var(--sub-text); font-weight: normal; }
    .theme-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; }

    .status-bar { font-size: 0.75rem; color: var(--sub-text); display: flex; justify-content: space-between; margin-bottom: 12px; padding: 4px 2px; }

    .quick-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-decoration: none; color: white; border: none; cursor: pointer; }
    .btn-notify { background-color: var(--success-color); }
    .btn-yahoo { background-color: #ff0033; }

    .card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 2px solid var(--primary-color); }
    .card-title { font-size: 1rem; font-weight: bold; }

    .form-body { margin-top: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-label { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 4px; display: block; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--card-bg); color: var(--text-color); font-size: 0.95rem; }
    
    .preview-box { flex: 1; padding: 8px; background: rgba(0,122,255,0.05); border: 1px solid rgba(0,122,255,0.2); border-radius: 6px; font-size: 0.85rem; min-height: 58px; display: flex; flex-direction: column; justify-content: center; }
    .stock-name-preview { font-weight: bold; color: var(--primary-color); font-size: 0.9rem; }
    .price-preview-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; font-size: 0.8rem; }
    .btn-copy-price { background: var(--primary-color); color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; }

    .checkbox-group { display: flex; gap: 16px; margin: 10px 0; font-size: 0.85rem; align-items: center; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .btn-action-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-main { flex: 2; padding: 10px 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
    .btn-secondary { flex: 1; padding: 10px 12px; background-color: #8e8e93; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    .filter-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px; }
    .filter-row { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; }

    .stock-item { background-color: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); position: relative; }
    .stock-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stock-title { font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .star-btn { cursor: pointer; font-size: 1.1rem; color: #ccc; }
    .star-btn.active { color: var(--warning-color); }

    .score-badge { background-color: var(--badge-bg); color: var(--badge-text); font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; }
    
    .stock-price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .current-price { font-size: 1.1rem; font-weight: bold; }
    .price-down { color: var(--danger-color); }
    .price-up { color: var(--success-color); }

    .target-info-row { font-size: 0.78rem; color: var(--sub-text); display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }

    .data-bar-container { position: relative; flex: 1; max-width: 110px; height: 16px; background-color: var(--border-color); border-radius: 8px; overflow: hidden; margin-left: auto; }
    .data-bar-fill { height: 100%; background: linear-gradient(90deg, #007aff, #34c759); transition: width 0.3s ease; border-radius: 8px; }
    .data-bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: #ffffff; text-shadow: 0px 0px 3px rgba(0, 0, 0, 0.8); pointer-events: none; }

    .memo-box { 
      display: block;
      text-align: left; 
      background: rgba(0,0,0,0.03); 
      border-left: 4px solid var(--primary-color); 
      padding: 8px 10px; 
      font-size: 0.8rem; 
      border-radius: 0 6px 6px 0; 
      margin-bottom: 8px; 
      white-space: pre-wrap; 
      word-break: break-all; 
    }
    body.dark-mode .memo-box { background: rgba(255,255,255,0.05); }

    .stock-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; border-top: 1px dashed var(--border-color); padding-top: 6px; }
    .icon-btn { background: none; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; color: var(--text-color); display: flex; align-items: center; gap: 3px; }

    .header-actions { display: flex; gap: 6px; }
    .btn-header-action { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }

    .edit-form-box { background: rgba(0, 122, 255, 0.05); border: 1px solid var(--primary-color); border-radius: 8px; padding: 10px; margin-top: 8px; }
    .edit-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="app-title">
      📈 株価アラート <span class="version-tag">ver 4.1.1</span>
    </div>
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()">🌙 ダークモード</button>
  </header>

  <div class="status-bar">
    <div id="monitoringStatus">● 監視実行中</div>
    <div id="marketStatus">市場: 判定中...</div>
  </div>

  <div class="quick-nav">
    <button class="nav-btn btn-notify" id="notifyToggleBtn" onclick="toggleNotification()">🔔 通知: ON</button>
    <a href="https://finance.yahoo.co.jp/portfolio" target="_blank" rel="noopener noreferrer" class="nav-btn btn-yahoo">
      📊 y!ポートフォリオ
    </a>
  </div>

  <!-- 登録フォーム -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">銘柄の新規登録</div>
    </div>

    <div class="form-body">
      <div class="form-group">
        <label class="form-label">銘柄コード（4桁）</label>
        <div class="input-row">
          <input type="text" id="stockCodeInput" placeholder="2814" maxlength="4" inputmode="numeric" pattern="[0-9]*" style="width: 85px;" oninput="onStockCodeChange()">
          <div class="preview-box">
            <div class="stock-name-preview" id="previewName">銘柄コードを入力してください</div>
            <div class="price-preview-row" id="pricePreviewRow" style="display: none;">
              <span id="previewPriceText">現在値: 取得中...</span>
              <button type="button" class="btn-copy-price" id="copyPriceBtn" onclick="applyPreviewPriceToTarget()" style="display:none;">指値に入力</button>
              <a id="previewYahooLink" href="#" target="_blank" style="text-decoration:none; font-size:0.75rem; color:#ff0033; font-weight:bold;">[y!で確認]</a>
            </div>
          </div>
        </div>
      </div>

      <div class="input-row form-group">
        <div style="flex: 1;">
          <label class="form-label">① 指値 (円以下)</label>
          <input type="number" id="targetPriceInput" placeholder="例: 1500" inputmode="numeric">
        </div>
        <div style="flex: 1;">
          <label class="form-label">② 下落率 (-%以上)</label>
          <input type="number" id="dropRateInput" placeholder="例: 3" step="0.1" inputmode="decimal">
        </div>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="favCheck"> ⭐ お気に入り</label>
        <label><input type="checkbox" id="benefitCheck"> 🎁 優待あり</label>
      </div>

      <div class="form-group">
        <label class="form-label">③ メモ（買い増し理由・優待内容など）</label>
        <input type="text" id="memoInput" placeholder="例: 決算発表後に確認">
      </div>

      <div class="btn-action-group">
        <button class="btn-main" onclick="saveNewStock()">➕ 新規追加</button>
        <button class="btn-secondary" onclick="resetNewForm()">🧹 クリア</button>
      </div>
    </div>
  </div>

  <!-- リスト -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">監視中のリスト</div>
      <div class="header-actions">
        <button class="btn-header-action" style="background-color: #6c757d;" id="bulkMemoBtn" onclick="toggleBulkMemo()">📝 メモ一括非表示</button>
        <button class="btn-header-action" id="refreshBtn" onclick="refreshPrices()">🔄 一括更新</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-row">
        <span>並び:</span>
        <select id="sortSelect" onchange="renderList()">
          <option value="chance">🔥 購入チャンス順</option>
          <option value="created">登録順</option>
          <option value="code">銘柄コード順</option>
          <option value="priceAsc">株価が安い順</option>
          <option value="priceDesc">株価が高い順</option>
        </select>
      </div>
    </div>

    <div id="stockList"></div>
  </div>

  <script>
    // 自作 Cloudflare Workers の URL
    const WORKER_URL = 'https://autumn-shape-d4ac.sub-katu20111023mio.workers.dev/';

    const initialStocks = [
      { id: '1', code: '2814', name: '佐藤食品工業', targetPrice: 1500, dropRate: 3, fav: false, benefit: false, memo: '', price: 0, change: 0, changePct: 0, showMemo: true },
      { id: '2', code: '4755', name: '楽天グループ', targetPrice: 700, dropRate: 3, fav: true, benefit: true, memo: '優待：モバイル', price: 0, change: 0, changePct: 0, showMemo: true },
      { id: '3', code: '9432', name: 'NTT (日本電信電話)', targetPrice: 160, dropRate: 3, fav: false, benefit: true, memo: '配当金目的。長期保有', price: 0, change: 0, changePct: 0, showMemo: true }
    ];

    let stocks = [];
    let isBulkMemoVisible = true;
    let currentFetchedPrice = 0;
    let editingStockId = null;
    let isNotifyOn = true;

    window.onload = function() {
      const saved = localStorage.getItem('stockAlerts_v4');
      stocks = saved ? JSON.parse(saved) : initialStocks;
      saveToLocalStorage();
      renderList();
      checkMarketStatus();
    };

    function checkMarketStatus() {
      const now = new Date();
      const day = now.getDay();
      const hour = now.getHours();
      const min = now.getMinutes();
      const totalMin = hour * 60 + min;

      let statusText = "市場: 営業時間外";
      if (day >= 1 && day <= 5) {
        if ((totalMin >= 540 && totalMin <= 690) || (totalMin >= 750 && totalMin <= 930)) {
          statusText = "市場: 💡 取引時間内";
        }
      }
      document.getElementById('marketStatus').textContent = statusText;
    }

    function toggleNotification() {
      isNotifyOn = !isNotifyOn;
      const btn = document.getElementById('notifyToggleBtn');
      btn.textContent = isNotifyOn ? '🔔 通知: ON' : '🔕 通知: OFF';
      btn.style.backgroundColor = isNotifyOn ? 'var(--success-color)' : '#8e8e93';
    }

    // 自作 Cloudflare Worker を通して株価を取得
    async function fetchStockPriceData(code) {
      try {
        const url = `${WORKER_URL}?code=${code}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Worker response failed');

        const text = await res.text();
        
        // 1. Workerが直接JSONオブジェクトを返している場合
        try {
          const json = JSON.parse(text);
          if (json && json.price) {
            return {
              price: parseFloat(json.price),
              change: parseFloat(json.change || 0),
              changePct: parseFloat(json.changePct || 0)
            };
          }
        } catch(e) {
          // JSONパース不可の場合はHTMLパースに進行
        }

        // 2. WorkerがYahoo!ファイナンスのHTMLを返している場合
        const match = text.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);
        if (match && match[1]) {
          const data = JSON.parse(match[1]);
          const detail = data?.props?.pageProps?.initialState?.stock?.detail;
          if (detail && detail.price) {
            return {
              price: parseFloat(detail.price),
              change: parseFloat(detail.priceChange || 0),
              changePct: parseFloat(detail.priceChangePercentage || 0)
            };
          }
        }
      } catch (e) {
        console.error('Worker Fetch Error:', e);
      }
      return null;
    }

    async function onStockCodeChange() {
      const code = document.getElementById('stockCodeInput').value.trim();
      const previewName = document.getElementById('previewName');
      const pricePreviewRow = document.getElementById('pricePreviewRow');
      const previewPriceText = document.getElementById('previewPriceText');
      const copyPriceBtn = document.getElementById('copyPriceBtn');
      const previewYahooLink = document.getElementById('previewYahooLink');

      if (code.length === 4) {
        const name = (typeof getStockNameFromDict === 'function') ? getStockNameFromDict(code) : `銘柄 ${code}`;
        previewName.textContent = `${name} (${code})`;
        
        pricePreviewRow.style.display = 'flex';
        previewPriceText.textContent = '現在値: 取得中...';
        copyPriceBtn.style.display = 'none';
        previewYahooLink.href = `https://finance.yahoo.co.jp/quote/${code}.T`;

        const data = await fetchStockPriceData(code);
        if (data) {
          currentFetchedPrice = data.price;
          previewPriceText.textContent = `現在値: ${data.price.toLocaleString()}円`;
          copyPriceBtn.style.display = 'inline-block';
        } else {
          previewPriceText.textContent = '現在値: 取得失敗';
        }
      } else {
        previewName.textContent = '銘柄コードを入力してください';
        pricePreviewRow.style.display = 'none';
      }
    }

    function applyPreviewPriceToTarget() {
      if (currentFetchedPrice > 0) {
        document.getElementById('targetPriceInput').value = currentFetchedPrice;
      }
    }

    async function saveNewStock() {
      const code = document.getElementById('stockCodeInput').value.trim();
      const targetPrice = parseFloat(document.getElementById('targetPriceInput').value);
      const dropRate = parseFloat(document.getElementById('dropRateInput').value);
      const fav = document.getElementById('favCheck').checked;
      const benefit = document.getElementById('benefitCheck').checked;
      const memo = document.getElementById('memoInput').value.trim();

      if (!code || code.length !== 4) {
        alert('4桁の銘柄コードを入力してください。');
        return;
      }

      const name = (typeof getStockNameFromDict === 'function') ? getStockNameFromDict(code) : `銘柄 ${code}`;

      let initialPrice = currentFetchedPrice || 0;
      let initialChange = 0;
      let initialChangePct = 0;

      if (initialPrice === 0) {
        const fetched = await fetchStockPriceData(code);
        if (fetched) {
          initialPrice = fetched.price;
          initialChange = fetched.change;
          initialChangePct = fetched.changePct;
        }
      }

      const newStock = {
        id: Date.now().toString(),
        code,
        name,
        targetPrice: targetPrice || null,
        dropRate: dropRate || null,
        fav,
        benefit,
        memo,
        price: initialPrice,
        change: initialChange,
        changePct: initialChangePct,
        showMemo: true
      };

      stocks.unshift(newStock);
      saveToLocalStorage();
      renderList();
      resetNewForm();
    }

    function resetNewForm() {
      document.getElementById('stockCodeInput').value = '';
      document.getElementById('targetPriceInput').value = '';
      document.getElementById('dropRateInput').value = '';
      document.getElementById('favCheck').checked = false;
      document.getElementById('benefitCheck').checked = false;
      document.getElementById('memoInput').value = '';
      document.getElementById('previewName').textContent = '銘柄コードを入力してください';
      document.getElementById('pricePreviewRow').style.display = 'none';
      currentFetchedPrice = 0;
    }

    function saveToLocalStorage() {
      localStorage.setItem('stockAlerts_v4', JSON.stringify(stocks));
    }

    function deleteStock(id) {
      if (confirm('この銘柄を削除してもよろしいですか？')) {
        stocks = stocks.filter(s => s.id !== id);
        saveToLocalStorage();
        renderList();
      }
    }

    function toggleFav(id) {
      const index = stocks.findIndex(s => s.id === id);
      if (index !== -1) {
        stocks[index].fav = !stocks[index].fav;
        saveToLocalStorage();
        renderList();
      }
    }

    function toggleSingleMemo(id) {
      const index = stocks.findIndex(s => s.id === id);
      if (index !== -1) {
        stocks[index].showMemo = !(stocks[index].showMemo !== false);
        saveToLocalStorage();
        renderList();
      }
    }

    function toggleBulkMemo() {
      isBulkMemoVisible = !isBulkMemoVisible;
      document.getElementById('bulkMemoBtn').textContent = isBulkMemoVisible ? '📝 メモ一括非表示' : '📝 メモ一括表示';
      stocks.forEach(s => s.showMemo = isBulkMemoVisible);
      saveToLocalStorage();
      renderList();
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // 個別更新機能
    async function refreshSingleStock(id, btnElement) {
      const index = stocks.findIndex(s => s.id === id);
      if (index === -1) return;

      const originalText = btnElement.innerHTML;
      btnElement.innerHTML = '⏳';
      btnElement.disabled = true;

      const data = await fetchStockPriceData(stocks[index].code);
      if (data) {
        stocks[index].price = data.price;
        stocks[index].change = data.change;
        stocks[index].changePct = data.changePct;
        saveToLocalStorage();
        renderList();
      } else {
        alert('株価の取得に失敗しました。時間をおいて再試行してください。');
        btnElement.innerHTML = originalText;
        btnElement.disabled = false;
      }
    }

    // 一括更新機能
    async function refreshPrices() {
      const btn = document.getElementById('refreshBtn');
      btn.textContent = '⏳ 更新中...';
      btn.disabled = true;

      for (let i = 0; i < stocks.length; i++) {
        const data = await fetchStockPriceData(stocks[i].code);
        if (data) {
          stocks[i].price = data.price;
          stocks[i].change = data.change;
          stocks[i].changePct = data.changePct;
        }
      }

      saveToLocalStorage();
      renderList();
      btn.textContent = '🔄 一括更新';
      btn.disabled = false;
    }

    // 編集機能
    function startEditStock(id) {
      editingStockId = id;
      renderList();
    }

    function cancelEditStock() {
      editingStockId = null;
      renderList();
    }

    function saveEditStock(id) {
      const index = stocks.findIndex(s => s.id === id);
      if (index === -1) return;

      const targetPrice = parseFloat(document.getElementById(`editTarget_${id}`).value);
      const dropRate = parseFloat(document.getElementById(`editDrop_${id}`).value);
      const memo = document.getElementById(`editMemo_${id}`).value.trim();
      const fav = document.getElementById(`editFav_${id}`).checked;
      const benefit = document.getElementById(`editBenefit_${id}`).checked;

      stocks[index].targetPrice = targetPrice || null;
      stocks[index].dropRate = dropRate || null;
      stocks[index].memo = memo;
      stocks[index].fav = fav;
      stocks[index].benefit = benefit;

      editingStockId = null;
      saveToLocalStorage();
      renderList();
    }

    function renderList() {
      const listContainer = document.getElementById('stockList');
      if (stocks.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--sub-text); padding: 20px;">監視中の銘柄がありません。</div>';
        return;
      }

      const sortType = document.getElementById('sortSelect').value;
      let sortedStocks = [...stocks];

      if (sortType === 'chance') {
        sortedStocks.sort((a, b) => {
          const scoreA = (a.targetPrice && a.price > 0) ? (a.targetPrice / a.price) : 0;
          const scoreB = (b.targetPrice && b.price > 0) ? (b.targetPrice / b.price) : 0;
          return scoreB - scoreA;
        });
      } else if (sortType === 'code') {
        sortedStocks.sort((a, b) => a.code.localeCompare(b.code));
      } else if (sortType === 'priceAsc') {
        sortedStocks.sort((a, b) => (a.price || 999999) - (a.price || 999999));
      } else if (sortType === 'priceDesc') {
        sortedStocks.sort((a, b) => (b.price || 0) - (a.price || 0));
      }

      let html = '';
      sortedStocks.forEach(item => {
        let chanceScore = 50;
        if (item.targetPrice && item.price > 0) {
          const ratio = (item.targetPrice / item.price);
          chanceScore = Math.min(99, Math.max(10, Math.round(ratio * 90)));
        }

        let progressPct = 80;
        if (item.targetPrice && item.price > 0) {
          progressPct = Math.min(100, Math.round((item.targetPrice / item.price) * 100));
        }

        const isEditing = editingStockId === item.id;
        const isMemoVisible = item.showMemo !== false;

        html += `
          <div class="stock-item">
            <div class="stock-top">
              <div class="stock-title">
                <span class="star-btn ${item.fav ? 'active' : ''}" onclick="toggleFav('${item.id}')">★</span>
                ${item.name} <span style="font-size: 0.8rem; color: var(--sub-text);">(${item.code})</span>
                <span class="score-badge">🔥 ${chanceScore}pt</span>
              </div>
              <div>
                <a href="https://finance.yahoo.co.jp/quote/${item.code}.T" target="_blank" style="text-decoration:none;">
                  <span style="background: #ff0033; color: white; border-radius: 4px; padding: 2px 5px; font-size: 0.7rem; font-weight: bold;">y!</span>
                </a>
              </div>
            </div>

            <div class="stock-price-row">
              ${item.price > 0 ? `
                <div class="current-price ${item.change < 0 ? 'price-down' : 'price-up'}">
                  ${item.change < 0 ? '⬇' : '⬆'}${item.price.toLocaleString()}円 
                  <span style="font-size: 0.8rem;">${item.change >= 0 ? '+' : ''}${item.change} (${item.changePct || 0}%)</span>
                </div>
              ` : `
                <div style="font-size:0.85rem; color: var(--sub-text);">株価未更新（「一括更新」で取得）</div>
              `}
              ${item.benefit ? `<div style="font-size:0.75rem; color:#d9534f; font-weight:bold;">🎁 優待あり</div>` : ''}
            </div>

            <div class="target-info-row">
              <span>指値: ${item.targetPrice ? item.targetPrice.toLocaleString() + '円' : '-'}</span>
              <span>下落: -${item.dropRate || 3}%</span>
              <div class="data-bar-container">
                <div class="data-bar-fill" style="width: ${progressPct}%;"></div>
                <div class="data-bar-text">${progressPct}%</div>
              </div>
            </div>

            ${(item.memo && isMemoVisible) ? `<div class="memo-box">📝 ${item.memo}</div>` : ''}

            ${isEditing ? `
              <div class="edit-form-box">
                <div class="edit-form-row">
                  <div style="flex: 1;">
                    <label class="form-label">指値 (円)</label>
                    <input type="number" id="editTarget_${item.id}" value="${item.targetPrice || ''}">
                  </div>
                  <div style="flex: 1;">
                    <label class="form-label">下落率 (%)</label>
                    <input type="number" id="editDrop_${item.id}" value="${item.dropRate || ''}" step="0.1">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">メモ</label>
                  <input type="text" id="editMemo_${item.id}" value="${item.memo || ''}">
                </div>
                <div class="checkbox-group">
                  <label><input type="checkbox" id="editFav_${item.id}" ${item.fav ? 'checked' : ''}> ⭐ お気に入り</label>
                  <label><input type="checkbox" id="editBenefit_${item.id}" ${item.benefit ? 'checked' : ''}> 🎁 優待あり</label>
                </div>
                <div class="btn-action-group">
                  <button class="btn-main" onclick="saveEditStock('${item.id}')">💾 保存</button>
                  <button class="btn-secondary" onclick="cancelEditStock()">キャンセル</button>
                </div>
              </div>
            ` : ''}

            <div class="stock-actions">
              <button class="icon-btn" onclick="startEditStock('${item.id}')">✏️ 編集</button>
              <button class="icon-btn" onclick="refreshSingleStock('${item.id}', this)">🔄 個別更新</button>
              <button class="icon-btn" onclick="toggleSingleMemo('${item.id}')">📝 メモ</button>
              <button class="icon-btn" onclick="deleteStock('${item.id}')">🗑️ 削除</button>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }
  </script>
</body>
</html>
