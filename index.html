<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株価アラート PWA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h1 { font-size: 1.2rem; margin-top: 0; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #007aff; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:active { background: #0056b3; }
    .result { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📈 株価リアルタイムアラート</h1>
    <label>銘柄コード (例: 7203)</label>
    <input type="text" id="ticker" placeholder="7203" value="7203">
    <label>目標価格 (円)</label>
    <input type="number" id="targetPrice" placeholder="3000">
    <button onclick="setAlert()">アラートを設定</button>
    <div class="result" id="status"></div>
  </div>

  <script>
    function setAlert() {
      const ticker = document.getElementById('ticker').value;
      const price = document.getElementById('targetPrice').value;
      if(!ticker || !price) {
        document.getElementById('status').innerText = '銘柄と目標価格を入力してください。';
        return;
      }
      document.getElementById('status').innerText = `【設定完了】${ticker} が ${price}円 になったら通知します！`;
    }
  </script>
</body>
</html>
