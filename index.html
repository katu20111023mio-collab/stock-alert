<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株価アラート ver 3.4.1</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --sub-text: #666666;
      --border-color: #e0e0e0;
      --primary-color: #007aff;
      --danger-color: #ff3b30;
      --success-color: #34c759;
      --warning-color: #ff9500;
      --badge-bg: #fff3cd;
      --badge-text: #856404;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --sub-text: #aaa;
      --border-color: #333;
      --badge-bg: #3a3000;
      --badge-text: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; max-width: 600px; margin: 0 auto; transition: background-color 0.3s, color 0.3s; }

    /* ヘッダー */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .app-title { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .version-tag { font-size: 0.75rem; color: var(--sub-text); font-weight: normal; }
    .theme-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; }

    /* ステータスバー */
    .status-bar { font-size: 0.75rem; color: var(--sub-text); display: flex; justify-content: space-between; margin-bottom: 12px; padding: 4px 2px; }

    /* クイックリンクボタン */
    .quick-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-decoration: none; color: white; border: none; cursor: pointer; }
    .btn-notify { background-color: var(--success-color); }
    .btn-yahoo { background-color: #ff0033; }

    /* カード枠 */
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 2px solid var(--primary-color); }
    .card-title { font-size: 1rem; font-weight: bold; }

    /* フォーム要素 */
    .form-body { margin-top: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-label { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 4px; display: block; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--card-bg); color: var(--text-color); font-size: 0.95rem; }
    
    .preview-box { flex: 1; padding: 8px; background: rgba(0,122,255,0.05); border: 1px solid rgba(0,122,255,0.2); border-radius: 6px; font-size: 0.85rem; min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
    .stock-name-preview { font-weight: bold; color: var(--primary-color); font-size: 0.9rem; }
    .stock-price-preview { margin-top: 2px; }

    .checkbox-group { display: flex; gap: 16px; margin: 10px 0; font-size: 0.85rem; align-items: center; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    /* ボタン群 */
    .btn-action-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-main { flex: 2; padding: 8px 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
    .btn-secondary { flex: 1; padding: 8px 12px; background-color: #8e8e93; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    /* 絞り込み・ソート */
    .filter-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px; }
    .filter-row { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; }

    /* 監視リストカード */
    .stock-item { background-color: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); position: relative; }
    .stock-item.editing-mode { border: 2px solid var(--primary-color); background-color: rgba(0, 122, 255, 0.02); }
    .stock-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stock-title { font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .star-btn { cursor: pointer; font-size: 1.1rem; color: #ccc; }
    .star-btn.active { color: var(--warning-color); }

    .score-badge { background-color: var(--badge-bg); color: var(--badge-text); font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; }
    
    .stock-price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .current-price { font-size: 1.1rem; font-weight: bold; }
    .price-down { color: var(--danger-color); }
    .price-up { color: var(--success-color); }
    .price-error { color: var(--sub-text); font-size: 0.85rem; }

    /* データソースバッジ */
    .source-badge { font-size: 0.65rem; background: #e9ecef; color: #495057; padding: 1px 4px; border-radius: 3px; margin-left: 4px; }

    /* 指値・下落率・データバーの1行レイアウト */
    .target-info-row { font-size: 0.78rem; color: var(--sub-text); display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }

    /* 1行収まり用コンパクトデータバー */
    .data-bar-container { position: relative; flex: 1; max-width: 110px; height: 16px; background-color: var(--border-color); border-radius: 8px; overflow: hidden; margin-left: auto; }
    .data-bar-fill { height: 100%; background: linear-gradient(90deg, #007aff, #34c759); transition: width 0.3s ease; border-radius: 8px; }
    .data-bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: #ffffff; text-shadow: 0px 0px 3px rgba(0, 0, 0, 0.8); pointer-events: none; }

    /* メモ領域 */
    .memo-box { 
      display: block !important;
      text-align: left !important; 
      background: rgba(0,0,0,0.03); 
      border-left: 4px solid var(--primary-color); 
      padding: 8px 10px; 
      font-size: 0.8rem; 
      border-radius: 0 6px 6px 0; 
      margin-bottom: 8px; 
      white-space: pre-wrap; 
      word-break: break-all; 
    }
    body.dark-mode .memo-box { background: rgba(255,255,255,0.05); }
    .memo-hidden { display: none !important; }

    /* カード下部操作ボタン */
    .stock-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; border-top: 1px dashed var(--border-color); padding-top: 6px; }
    .icon-btn { background: none; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; color: var(--text-color); display: flex; align-items: center; gap: 3px; }
    .icon-btn:hover { background-color: rgba(0,0,0,0.05); }

    .header-actions { display: flex; gap: 6px; }
    .btn-header-action { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="app-title">
      📈 株価アラート <span class="version-tag">ver 3.4.1</span>
    </div>
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()">🌙 ダークモード</button>
  </header>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div id="monitoringStatus">● 監視実行中</div>
    <div id="marketStatus">市場: 判定中...</div>
  </div>

  <!-- クイックナビボタン -->
  <div class="quick-nav">
    <button class="nav-btn btn-notify" onclick="toggleNotificationSetting()">🔔 通知: ON</button>
    <a href="https://finance.yahoo.co.jp/portfolio" target="_blank" rel="noopener noreferrer" class="nav-btn btn-yahoo">
      📊 y!ポートフォリオ
    </a>
  </div>

  <!-- 登録フォームカード -->
  <div class="card" id="formCard">
    <div class="card-header">
      <div class="card-title">銘柄の新規登録</div>
      <button class="btn-header-action" id="toggleFormBtn" onclick="toggleFormCard()">▲ フォームをたたむ</button>
    </div>

    <div class="form-body" id="formBody">
      <div class="form-group">
        <label class="form-label">銘柄コード（4桁）</label>
        <div class="input-row">
          <input type="text" id="stockCodeInput" placeholder="2814" maxlength="4" inputmode="numeric" pattern="[0-9]*" style="width: 85px;" oninput="onStockCodeChange()">
          <div class="preview-box" id="previewBox">
            <div class="stock-name-preview" id="previewName">銘柄コードを入力してください</div>
            <div class="stock-price-preview" id="previewPrice">- 円</div>
          </div>
        </div>
      </div>

      <div class="input-row form-group">
        <div style="flex: 1;">
          <label class="form-label">① 指値 (円以下)</label>
          <input type="number" id="targetPriceInput" placeholder="例: 1500" inputmode="numeric">
        </div>
        <div style="flex: 1;">
          <label class="form-label">② 下落率 (-%以上)</label>
          <input type="number" id="dropRateInput" placeholder="例: 3" step="0.1" inputmode="decimal">
        </div>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="favCheck"> ⭐ お気に入り</label>
        <label><input type="checkbox" id="benefitCheck"> 🎁 優待あり</label>
      </div>

      <div class="form-group">
        <label class="form-label">③ メモ（買い増し理由・優待内容など）</label>
        <input type="text" id="memoInput" placeholder="例: 決算発表後に確認">
      </div>

      <div class="btn-action-group">
        <button class="btn-main" id="addBtn" onclick="saveNewStock()">➕ 新規追加</button>
        <button class="btn-secondary" onclick="resetNewForm()">🧹 クリア</button>
      </div>
    </div>
  </div>

  <!-- 監視中のリスト カード -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">監視中のリスト</div>
      <div class="header-actions">
        <button class="btn-header-action" style="background-color: #6c757d;" id="bulkMemoBtn" onclick="toggleBulkMemo()">📝 メモ一括表示</button>
        <button class="btn-header-action" id="refreshBtn" onclick="refreshPrices()">🔄 一括更新</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-row">
        <span>並び:</span>
        <select id="sortSelect" onchange="renderList()">
          <option value="chance">🔥 購入チャンス順</option>
          <option value="created">登録順</option>
          <option value="code">銘柄コード順</option>
          <option value="priceAsc">株価が安い順</option>
          <option value="priceDesc">株価が高い順</option>
        </select>
      </div>
      <div class="filter-row">
        <span>株価絞り込み:</span>
        <input type="number" id="filterMinPrice" placeholder="最小" inputmode="numeric" style="width: 70px;" oninput="renderList()"> 円 ～ 
        <input type="number" id="filterMaxPrice" placeholder="最大" inputmode="numeric" style="width: 70px;" oninput="renderList()"> 円
      </div>
    </div>

    <div id="stockList"></div>
  </div>

  <script>
    const initialStocks = [
      { id: '1', code: '2814', name: '佐藤食品工業', targetPrice: 1500, dropRate: 3, fav: false, benefit: false, memo: '', price: 0, change: 0, changePct: 0, market: 'T' },
      { id: '2', code: '4755', name: '楽天グループ', targetPrice: 700, dropRate: 3, fav: true, benefit: true, memo: '優待：モバイル', price: 0, change: 0, changePct: 0, market: 'T' },
      { id: '3', code: '9432', name: '日本電信電話 (NTT)', targetPrice: 160, dropRate: 3, fav: false, benefit: true, memo: '配当金目的。長期保有', price: 0, change: 0, changePct: 0, market: 'T' }
    ];

    const japaneseHolidays2026 = [
      "2026-01-01", "2026-01-12", "2026-02-11", "2026-02-23", "2026-03-20",
      "2026-04-29", "2026-05-03", "2026-05-04", "2026-05-05", "2026-05-06",
      "2026-07-20", "2026-08-11", "2026-09-21", "2026-09-22", "2026-09-23",
      "2026-10-12", "2026-11-03", "2026-11-23"
    ];

    let stocks = [];
    let inlineEditingId = null;
    let isBulkMemoVisible = false;
    let individualMemoState = {};
    let isFormVisible = true;

    // --- 全自動レスキュー＆読み込み機能 ---
    window.onload = function() {
      const keysToSearch = [
        'stockAlerts_v3.4',
        'stockAlerts_v3.3',
        'stockAlerts_v3.2',
        'stockAlerts_v3.1',
        'stockAlerts_v3.0',
        'stockAlerts_v3',
        'stockAlerts_v2',
        'stockAlerts'
      ];

      let restoredData = null;
      let foundKey = '';

      for (const key of keysToSearch) {
        const data = localStorage.getItem(key);
        if (data) {
          try {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed) && parsed.length > 0) {
              restoredData = parsed;
              foundKey = key;
              break;
            }
          } catch(e) {}
        }
      }

      if (restoredData) {
        stocks = restoredData;
        console.log(`旧保存キー [${foundKey}] から銘柄データを復元しました。`);
      } else {
        stocks = initialStocks;
      }

      saveToLocalStorage(); // 統合保存
      renderList();
      updateMarketStatus();
      setInterval(updateMarketStatus, 30000);
      refreshPrices();
    };

    function updateMarketStatus() {
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      function formatDateStr(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${date}`;
      }

      function isClosedDay(d) {
        const dw = d.getDay();
        if (dw === 0 || dw === 6) return true;
        const str = formatDateStr(d);
        if (japaneseHolidays2026.includes(str)) return true;
        const m = d.getMonth() + 1;
        const date = d.getDate();
        if ((m === 12 && date === 31) || (m === 1 && date <= 3)) return true;
        return false;
      }

      const isTodayClosed = isClosedDay(now);

      function getNextOpenText() {
        if (!isTodayClosed && currentMins < 540) return "本日 09:00〜";
        if (!isTodayClosed && currentMins >= 690 && currentMins < 750) return "本日 12:30〜";

        let checkDate = new Date(now);
        checkDate.setDate(checkDate.getDate() + 1);
        checkDate.setHours(9, 0, 0, 0);

        while (isClosedDay(checkDate)) {
          checkDate.setDate(checkDate.getDate() + 1);
        }

        const diffTime = checkDate.getTime() - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        const daysArr = ["日", "月", "火", "水", "木", "金", "土"];
        const dayOfWeek = daysArr[checkDate.getDay()];

        if (diffDays <= 1) return "明日 09:00〜";
        if (checkDate.getDay() === 1 && diffDays <= 3) return "月曜 09:00〜";
        return `${checkDate.getMonth() + 1}月${checkDate.getDate()}日(${dayOfWeek}) 09:00〜`;
      }

      const marketStatusEl = document.getElementById('marketStatus');
      const monitoringStatusEl = document.getElementById('monitoringStatus');

      if (!isTodayClosed) {
        if ((currentMins >= 540 && currentMins < 690) || (currentMins >= 750 && currentMins <= 930)) {
          monitoringStatusEl.textContent = '● 監視実行中';
          marketStatusEl.textContent = '市場: 営業中 (次回更新: 1分以内)';
          return;
        } else if (currentMins >= 690 && currentMins < 750) {
          monitoringStatusEl.textContent = '● 監視一時停止中';
          marketStatusEl.textContent = `市場: 昼休 (次回オープン: ${getNextOpenText()})`;
          return;
        }
      }

      monitoringStatusEl.textContent = '● 監視停止中';
      marketStatusEl.textContent = `市場: ${isTodayClosed ? '休場' : '営業時間外'} (次回オープン: ${getNextOpenText()})`;
    }

    async function onStockCodeChange() {
      const code = document.getElementById('stockCodeInput').value.trim();
      const previewName = document.getElementById('previewName');
      const previewPrice = document.getElementById('previewPrice');

      if (code.length === 4) {
        previewName.textContent = `取得中... (${code})`;
        previewPrice.textContent = 'リアルタイム株価を検索中...';

        const fetched = await fetchRealtimeStock(code);
        if (fetched && !fetched.error) {
          previewName.textContent = `${fetched.name} (${code})`;
          previewPrice.innerHTML = `<span class="price-up">${fetched.price.toLocaleString()}円</span> (${fetched.change >= 0 ? '+' : ''}${fetched.change})`;
        } else {
          previewName.textContent = `銘柄 ${code}`;
          previewPrice.textContent = '⚠️ 株価の自動取得に失敗しました';
        }
      } else {
        previewName.textContent = '銘柄コードを入力してください';
        previewPrice.textContent = '- 円';
      }
    }

    async function fetchFromYahoo(code) {
      const market = (code === '2928') ? 'S' : 'T';
      const targetUrl = `https://finance.yahoo.co.jp/quote/${code}.${market}`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const json = await res.json();
          const html = json.contents || "";

          const matchScript = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);
          if (matchScript && matchScript[1]) {
            const data = JSON.parse(matchScript[1]);
            const stockDetail = data?.props?.pageProps?.initialState?.stock?.detail;
            if (stockDetail && stockDetail.price) {
              return {
                code,
                name: stockDetail.name || stockDetail.symbolName,
                price: parseFloat(stockDetail.price),
                change: parseFloat(stockDetail.priceChange || 0),
                changePct: parseFloat(stockDetail.priceChangePercentage || 0),
                market,
                source: 'Yahoo'
              };
            }
          }
        }
      } catch (e) {}
      return null;
    }

    async function fetchFromKabutan(code) {
      const targetUrl = `https://kabutan.jp/stock/?code=${code}`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const json = await res.json();
          const html = json.contents || "";

          const priceMatch = html.match(/class="kabuka"[^>]*>([\d,.]+)/i) || html.match(/<span class="kabuka">([\d,.]+)/i);
          const nameMatch = html.match(/<h2>([^<]+)\s*\(${code}\)/) || html.match(/<h3>([^<]+)<\/h3>/);

          if (priceMatch) {
            const price = parseFloat(priceMatch[1].replace(/,/g, ''));
            const name = nameMatch ? nameMatch[1].trim() : `銘柄 ${code}`;

            if (!isNaN(price) && price > 0) {
              return {
                code,
                name,
                price,
                change: 0,
                changePct: 0,
                market: 'T',
                source: '株探'
              };
            }
          }
        }
      } catch (e) {}
      return null;
    }

    async function fetchRealtimeStock(code) {
      let result = await fetchFromYahoo(code);
      if (result && result.price > 0) return result;

      result = await fetchFromKabutan(code);
      if (result && result.price > 0) return result;

      return { code, name: `銘柄 ${code}`, price: 0, change: 0, changePct: 0, market: 'T', error: true };
    }

    function toggleFormCard() {
      isFormVisible = !isFormVisible;
      const formBody = document.getElementById('formBody');
      const toggleBtn = document.getElementById('toggleFormBtn');
      if (isFormVisible) {
        formBody.style.display = 'block';
        toggleBtn.textContent = '▲ フォームをたたむ';
      } else {
        formBody.style.display = 'none';
        toggleBtn.textContent = '▼ フォームを開く';
      }
    }

    function saveToLocalStorage() {
      // 過去の互換キーも含めて同期保存
      const dataStr = JSON.stringify(stocks);
      localStorage.setItem('stockAlerts_v3.4', dataStr);
      localStorage.setItem('stockAlerts_v3.3', dataStr);
      localStorage.setItem('stockAlerts', dataStr);
    }

    async function saveNewStock() {
      const code = document.getElementById('stockCodeInput').value.trim();
      const targetPrice = parseFloat(document.getElementById('targetPriceInput').value);
      const dropRate = parseFloat(document.getElementById('dropRateInput').value);
      const fav = document.getElementById('favCheck').checked;
      const benefit = document.getElementById('benefitCheck').checked;
      const memo = document.getElementById('memoInput').value.trim();

      if (!code || code.length !== 4) {
        alert('4桁の銘柄コードを入力してください。');
        return;
      }

      const addBtn = document.getElementById('addBtn');
      addBtn.textContent = '⏳ 追加中...';
      addBtn.disabled = true;

      const fetchedData = await fetchRealtimeStock(code);

      const newStock = {
        id: Date.now().toString(),
        code,
        name: fetchedData.error ? `銘柄 ${code}` : fetchedData.name,
        targetPrice,
        dropRate,
        fav,
        benefit,
        memo,
        price: fetchedData.price,
        change: fetchedData.change,
        changePct: fetchedData.changePct,
        market: fetchedData.market,
        source: fetchedData.source || '',
        error: fetchedData.error
      };
      stocks.unshift(newStock);

      saveToLocalStorage();
      renderList();
      resetNewForm();

      addBtn.textContent = '➕ 新規追加';
      addBtn.disabled = false;
    }

    function resetNewForm() {
      document.getElementById('stockCodeInput').value = '';
      document.getElementById('targetPriceInput').value = '';
      document.getElementById('dropRateInput').value = '';
      document.getElementById('favCheck').checked = false;
      document.getElementById('benefitCheck').checked = false;
      document.getElementById('memoInput').value = '';
      onStockCodeChange();
    }

    function startInlineEdit(id) {
      inlineEditingId = id;
      renderList();
    }

    function cancelInlineEdit() {
      inlineEditingId = null;
      renderList();
    }

    function saveInlineEdit(id) {
      const targetPrice = parseFloat(document.getElementById(`inlineTarget_${id}`).value);
      const dropRate = parseFloat(document.getElementById(`inlineDrop_${id}`).value);
      const fav = document.getElementById(`inlineFav_${id}`).checked;
      const benefit = document.getElementById(`inlineBenefit_${id}`).checked;
      const memo = document.getElementById(`inlineMemo_${id}`).value.trim();

      const index = stocks.findIndex(s => s.id === id);
      if (index !== -1) {
        stocks[index].targetPrice = targetPrice || null;
        stocks[index].dropRate = dropRate || null;
        stocks[index].fav = fav;
        stocks[index].benefit = benefit;
        stocks[index].memo = memo;
        saveToLocalStorage();
      }

      inlineEditingId = null;
      renderList();
    }

    function deleteStock(id) {
      if (confirm('このアラートを削除してもよろしいですか？')) {
        stocks = stocks.filter(s => s.id !== id);
        saveToLocalStorage();
        renderList();
      }
    }

    function toggleBulkMemo() {
      isBulkMemoVisible = !isBulkMemoVisible;
      const btn = document.getElementById('bulkMemoBtn');
      btn.textContent = isBulkMemoVisible ? '📝 メモ一括非表示' : '📝 メモ一括表示';
      renderList();
    }

    function toggleSingleMemo(id) {
      individualMemoState[id] = !individualMemoState[id];
      renderList();
    }

    function toggleFav(id) {
      const index = stocks.findIndex(s => s.id === id);
      if (index !== -1) {
        stocks[index].fav = !stocks[index].fav;
        saveToLocalStorage();
        renderList();
      }
    }

    async function refreshSinglePrice(id) {
      const index = stocks.findIndex(s => s.id === id);
      if (index === -1) return;

      const btn = document.getElementById(`refreshSingleBtn_${id}`);
      if (btn) btn.textContent = '⏳...';

      const updated = await fetchRealtimeStock(stocks[index].code);
      if (!updated.error && updated.price > 0) {
        stocks[index].price = updated.price;
        stocks[index].name = updated.name;
        stocks[index].change = updated.change;
        stocks[index].changePct = updated.changePct;
        stocks[index].source = updated.source;
        stocks[index].error = false;
      } else {
        stocks[index].error = true;
      }

      saveToLocalStorage();
      renderList();
    }

    async function refreshPrices() {
      const btn = document.getElementById('refreshBtn');
      btn.textContent = '⏳ 更新中...';
      btn.disabled = true;

      for (let i = 0; i < stocks.length; i++) {
        const updated = await fetchRealtimeStock(stocks[i].code);
        if (!updated.error && updated.price > 0) {
          stocks[i].price = updated.price;
          stocks[i].name = updated.name;
          stocks[i].change = updated.change;
          stocks[i].changePct = updated.changePct;
          stocks[i].source = updated.source;
          stocks[i].error = false;
        } else {
          stocks[i].error = true;
        }
      }

      saveToLocalStorage();
      renderList();

      btn.textContent = '🔄 一括更新';
      btn.disabled = false;
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const btn = document.getElementById('themeToggleBtn');
      btn.textContent = document.body.classList.contains('dark-mode') ? '☀️ ライトモード' : '🌙 ダークモード';
    }

    function toggleNotificationSetting() {
      alert('通知設定を切り替えました。');
    }

    function renderList() {
      const listContainer = document.getElementById('stockList');
      const sortVal = document.getElementById('sortSelect').value;
      const minPrice = parseFloat(document.getElementById('filterMinPrice').value) || 0;
      const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || Infinity;

      let filtered = stocks.filter(s => s.price >= minPrice && s.price <= maxPrice);

      filtered.sort((a, b) => {
        if (sortVal === 'chance') {
          const ratioA = (a.targetPrice && a.price > 0) ? (a.price / a.targetPrice) : 999;
          const ratioB = (b.targetPrice && b.price > 0) ? (b.price / b.targetPrice) : 999;
          return ratioA - ratioB;
        } else if (sortVal === 'code') {
          return a.code.localeCompare(b.code);
        } else if (sortVal === 'priceAsc') {
          return a.price - b.price;
        } else if (sortVal === 'priceDesc') {
          return b.price - a.price;
        }
        return 0;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--sub-text); padding: 20px;">監視中の銘柄がありません。</div>';
        return;
      }

      let html = '';
      filtered.forEach(item => {
        const isEditing = (inlineEditingId === item.id);

        if (isEditing) {
          html += `
            <div class="stock-item editing-mode">
              <div class="stock-top">
                <div class="stock-title">✏️ ${item.name} (${item.code}) の編集</div>
              </div>

              <div class="input-row form-group" style="margin-top: 8px;">
                <div style="flex: 1;">
                  <label class="form-label">指値 (円以下)</label>
                  <input type="number" id="inlineTarget_${item.id}" value="${item.targetPrice || ''}" placeholder="例: 1500" inputmode="numeric">
                </div>
                <div style="flex: 1;">
                  <label class="form-label">下落率 (-%以上)</label>
                  <input type="number" id="inlineDrop_${item.id}" value="${item.dropRate || ''}" placeholder="例: 3" step="0.1" inputmode="decimal">
                </div>
              </div>

              <div class="checkbox-group">
                <label><input type="checkbox" id="inlineFav_${item.id}" ${item.fav ? 'checked' : ''}> ⭐ お気に入り</label>
                <label><input type="checkbox" id="inlineBenefit_${item.id}" ${item.benefit ? 'checked' : ''}> 🎁 優待あり</label>
              </div>

              <div class="form-group">
                <label class="form-label">メモ</label>
                <input type="text" id="inlineMemo_${item.id}" value="${item.memo || ''}" placeholder="メモを入力...">
              </div>

              <div class="btn-action-group" style="margin-top: 10px;">
                <button class="btn-main" onclick="saveInlineEdit('${item.id}')">💾 保存</button>
                <button class="btn-secondary" onclick="cancelInlineEdit()">❌ キャンセル</button>
              </div>
            </div>
          `;
        } else {
          let chanceScore = 50;
          if (item.targetPrice && item.price > 0) {
            const ratio = (item.targetPrice / item.price);
            chanceScore = Math.min(99, Math.max(10, Math.round(ratio * 90)));
          }

          const isMemoShow = isBulkMemoVisible || !!individualMemoState[item.id];

          let progressPct = 80;
          if (item.targetPrice && item.price > 0) {
            progressPct = Math.min(100, Math.round((item.targetPrice / item.price) * 100));
          }

          const market = item.market || (item.code === '2928' ? 'S' : 'T');

          html += `
            <div class="stock-item">
              <div class="stock-top">
                <div class="stock-title">
                  <span class="star-btn ${item.fav ? 'active' : ''}" onclick="toggleFav('${item.id}')">★</span>
                  ${item.name} <span style="font-size: 0.8rem; color: var(--sub-text);">(${item.code})</span>
                  <span class="score-badge">🔥 ${chanceScore}pt</span>
                </div>
                <div>
                  <a href="https://finance.yahoo.co.jp/quote/${item.code}.${market}" target="_blank" style="text-decoration:none;">
                    <span style="background: #ff0033; color: white; border-radius: 4px; padding: 2px 5px; font-size: 0.7rem; font-weight: bold;">y!</span>
                  </a>
                </div>
              </div>

              <div class="stock-price-row">
                ${item.error || item.price === 0 ? `
                  <div class="price-error">⚠️ 株価取得失敗（🔄ボタンで再取得）</div>
                ` : `
                  <div class="current-price ${item.change < 0 ? 'price-down' : 'price-up'}">
                    ${item.change < 0 ? '⬇' : '⬆'}${item.price.toLocaleString()}円 
                    <span style="font-size: 0.8rem;">${item.change >= 0 ? '+' : ''}${item.change} (${item.changePct \vert{}\vert{} 0}\%)</span>${item.source ? `<span class="source-badge">${item.source}</span>` : ''}
                  </div>
                `}
                ${item.benefit ? `<div style="font-size:0.75rem; color:#d9534f; font-weight:bold;">🎁 優待 (26/09)</div>` : ''}
              </div>

              <div class="target-info-row">
                <span>指値: ${item.targetPrice ? item.targetPrice.toLocaleString() + '円' : '-'}</span>
                <span>下落: -${item.dropRate || 3}%</span>
                <div class="data-bar-container">
                  <div class="data-bar-fill" style="width: ${progressPct}%;"></div>
                  <div class="data-bar-text">${progressPct}%</div>
                </div>
              </div>

              ${item.memo ? `
                <div class="memo-box ${isMemoShow ? '' : 'memo-hidden'}">📝 ${item.memo}</div>
              ` : ''}

              <div class="stock-actions">
                <button class="icon-btn" id="refreshSingleBtn_${item.id}" onclick="refreshSinglePrice('${item.id}')">🔄 更新</button>
                ${item.memo ? `
                  <button class="icon-btn" onclick="toggleSingleMemo('${item.id}')">
                    ${individualMemoState[item.id] ? '🙈 メモ隠す' : '📝 メモ見る'}
                  </button>
                ` : ''}
                <button class="icon-btn" onclick="startInlineEdit('${item.id}')">✏️ 編集</button>
                <button class="icon-btn" onclick="deleteStock('${item.id}')">🗑️ 削除</button>
              </div>
            </div>
          `;
        }
      });

      listContainer.innerHTML = html;
    }
  </script>
</body>
</html>
