<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本株リアルタイムアラート</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --danger: #ef4444; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-bottom: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    label { display: block; font-size: 0.85rem; margin-top: 12px; color: #94a3b8; }
    input, select, button { width: 100%; padding: 14px; margin-top: 6px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 1rem; }
    button { background: var(--accent); color: #0f172a; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    .alert-list { margin-top: 24px; }
    .alert-item { background: var(--card); padding: 14px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
    .alert-item .price { font-weight: bold; color: var(--accent); }
    .delete-btn { background: var(--danger); color: #fff; width: auto; padding: 6px 12px; margin: 0; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 日本株 アラート PWA</h1>
    <div class="card">
      <label>銘柄コード (例: 7203)</label>
      <input type="number" id="ticker" placeholder="7203" required>
      
      <label>条件</label>
      <select id="condition">
        <option value="above">指定価格以上になったら通知</option>
        <option value="below">指定価格以下になったら通知</option>
      </select>
      
      <label>目標価格 (円)</label>
      <input type="number" id="targetPrice" placeholder="2500" required>
      
      <button onclick="addAlert()">監視を開始する</button>
    </div>

    <div class="alert-list" id="alertList"></div>
  </div>

  <script>
    let alerts = JSON.parse(localStorage.getItem('stock_alerts') || '[]');

    function renderAlerts() {
      const list = document.getElementById('alertList');
      list.innerHTML = alerts.map((item, index) => `
        <div class="alert-item">
          <div>
            <strong>${item.ticker}</strong> 
            <span>${item.condition === 'above' ? '▲ 以上' : '▼ 以下'}</span>
          </div>
          <div class="price">${item.price}円</div>
          <button class="delete-btn" onclick="removeAlert(${index})">削除</button>
        </div>
      `).join('');
    }

    function addAlert() {
      const ticker = document.getElementById('ticker').value;
      const condition = document.getElementById('condition').value;
      const price = document.getElementById('targetPrice').value;

      if (!ticker || !price) return alert('銘柄コードと価格を入力してください');

      alerts.push({ ticker, condition, price });
      localStorage.setItem('stock_alerts', JSON.stringify(alerts));
      renderAlerts();

      document.getElementById('ticker').value = '';
      document.getElementById('targetPrice').value = '';
    }

    function removeAlert(index) {
      alerts.splice(index, 1);
      localStorage.setItem('stock_alerts', JSON.stringify(alerts));
      renderAlerts();
    }

    renderAlerts();
  </script>
</body>
</html>
